<style>
:root{
  --ink:#191F28;--sub:#6B7684;--faint:#9AA092;--line:#E4E7DF;--wash:#F6F7F3;
  --olive:#4B5D3A;--olive-d:#3A4A2C;--olive-t:#EEF2E7;--olive-m:#C9D3BC;
  --red:#B3261E;--red-t:#FBEDEC;--amber:#8A5A00;--amber-t:#FBF3E2;
  --bg:#F2F3F0;--serif:Pretendard,'Inter','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Inter','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em;word-break:keep-all}
button{font-family:inherit;color:inherit;cursor:pointer}
b{font-weight:600}
p{margin:0}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg)}
.page{min-height:100vh;display:flex;flex-direction:column}
.pad{padding:28px 20px 120px;flex:1}
.pad.tight{padding-top:20px}
.sub{color:var(--sub);font-size:14px}
.faint{color:var(--faint);font-size:12px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.olive{color:var(--olive)} .red{color:var(--red)} .amber{color:var(--amber)}
.up{color:var(--olive);font-weight:700} .down{color:var(--red);font-weight:700}
.kicker{font-size:14px;font-weight:600;color:var(--sub)}
.h1{font-size:28px;line-height:1.36;margin:6px 0 18px;font-weight:700;letter-spacing:-.04em}
.h2{font-family:var(--serif);font-size:20px;margin:0 0 6px;font-weight:700}
.h3{font-size:15px;margin:0;font-weight:700}
/* 하단 버튼 */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;padding:12px 16px 18px;background:linear-gradient(to top,var(--bg) 78%,rgba(242,243,240,0));z-index:5}
.bar.withtabs{bottom:66px;padding-bottom:10px}
.btn{width:100%;height:56px;border:0;border-radius:16px;background:var(--olive);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.02em}
.btn:hover{background:var(--olive-d)}
.btn:disabled{background:#D9DED2;color:#7D8476;cursor:default}
.btn.line{background:#fff;color:var(--olive);border:1.5px solid var(--olive)}
.btn.line:hover{background:var(--olive-t)}
.btn.quiet{background:#fff;color:var(--ink)}
.btn.danger{background:var(--red)}
.two{display:flex;gap:8px}
.link{border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:12px;display:block;margin:6px auto 0}
/* 상단 */
.top{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;position:sticky;top:0;background:var(--bg);z-index:4}
.top .t{font-weight:700;font-size:22px;letter-spacing:-.04em}
.top .sp{flex:1}
.yr{font-size:16px;color:var(--sub);font-weight:500}
.iconbtn{border:0;background:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;margin-right:-8px}
.iconbtn:hover{background:var(--wash)}
/* 문서 블록 */
.doc{border-radius:22px;margin:12px 12px 0;background:#fff}
.doc>.hd{display:flex;align-items:center;gap:8px;padding:22px 22px 4px;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.doc>.hd span{flex:1}
.doc>.hd em{font-style:normal;font-weight:500;color:var(--faint);font-size:13px}
.doc>.bd{padding:14px 20px 20px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;min-height:22px}
.kv>span{color:var(--sub)}
.kv>b{font-weight:500;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.kv+.kv{margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12px;font-weight:600;color:#4E5968;background:#F2F3F0;border-radius:6px;padding:3px 8px;white-space:nowrap}
.chip.gray,.chip.amber,.chip.line{color:#4E5968;background:#F2F3F0;border:0}
.chip.red{color:var(--red);background:#F2F3F0}
.chip.on{color:var(--olive);background:var(--olive-t)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* 복무 카드 */
.svc{display:flex;gap:16px;align-items:center}
.svc .badge{width:96px;display:flex;justify-content:center;flex-shrink:0}
.svc .who{flex:1;min-width:0}
.svc .nm{font-size:22px;font-weight:700;margin:2px 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rackrow{display:flex;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);min-height:20px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.nums b{display:block;font-size:19px;font-weight:700;margin-top:2px}
.nums>div+div{border-left:1px solid var(--line)}
/* 목록 행 */
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;min-height:52px}
.row+.row{border-top:0}
.row .g{flex:1;min-width:0}
.row .g b{display:block;font-size:15px}
.row .g span{font-size:13px;color:var(--sub)}
.row:not([data-act="noop"]):hover .g b{color:var(--olive)}
.mark{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--olive-t);color:var(--olive)}
.mark.amber{background:var(--amber-t);color:var(--amber)}
.mark.gray{background:var(--wash);color:var(--sub)}
.mark.red{background:var(--red-t);color:var(--red)}
/* 결재 대기 */
.pending{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:16px;width:100%;background:var(--olive-t);text-align:left}
.pending:hover{background:#E4EADB}
.pending .g{flex:1}
.pending .g b{display:block;font-size:16px;margin-top:3px}
.done{display:flex;align-items:center;gap:12px;padding:4px 0}
.done .g{flex:1}
.done .g b{display:block;font-size:15px}
.done .g span{font-size:13px;color:var(--sub)}
/* 탭바 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;background:#fff;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:22px 22px 0 0;box-shadow:0 -1px 0 #E8EAE4;height:66px;z-index:6}
.nav{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A2A898;font-size:11px;font-weight:700;position:relative}
.nav.on{color:var(--olive)}
.stack{padding-bottom:150px}
/* 능력치 */
.stat+.stat{margin-top:14px}
.track{height:6px;border-radius:3px;background:var(--wash);margin-top:6px;overflow:hidden}
.track div{height:100%;background:var(--olive);border-radius:3px}
.track.light div{background:var(--olive-m)}
.body{font-size:14px;line-height:1.7;color:#4B5146}
/* 동기 */
.mate{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mate:first-child{border-top:0}
.mate .g{flex:1;min-width:0}
.mate .g b{display:block;font-size:15px}
.mate .g span{font-size:12px;color:var(--sub)}
.mate.me{background:var(--olive-t);margin:0 -14px;padding:10px 14px}
.mate.off{opacity:.5}
.rk{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--sub);min-width:58px}
/* 문서형 화면 */
.paper{border-radius:22px;padding:22px 20px;position:relative;background:#fff}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.paper .title{font-size:21px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
.paper .no{font-size:12px;color:var(--faint)}
.meta{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:14px}
.meta .kv{padding:7px 2px;margin:0;border-top:1px solid var(--line)}
.meta .kv:first-child{border-top:0}
.stamp{flex-shrink:0;width:70px;height:70px;border:3px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-family:var(--serif);opacity:.88;background:rgba(255,255,255,.6)}
.stamp b{font-size:19px;line-height:1;font-weight:700}
.stamp i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em}
.stamp.olive{border-color:var(--olive);color:var(--olive)}
.stamp.pop{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(1.8)}to{opacity:.88;transform:rotate(-12deg) scale(1)}}
.line-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line-item:first-child{border-top:0}
.line-item .tick{width:3px;border-radius:2px;background:var(--line);flex-shrink:0}
.line-item.good .tick{background:var(--olive)}
.line-item.bad .tick{background:var(--red)}
.line-item .g{flex:1;min-width:0}
.line-item .g b{display:block;font-size:14px}
.line-item .g span{font-size:13px;color:var(--sub);line-height:1.45}
.line-item em{font-style:normal;font-size:13px;font-weight:700;white-space:nowrap;color:var(--sub)}
.line-item.good em{color:var(--olive)} .line-item.bad em{color:var(--red)}
.opinion{border-left:3px solid var(--olive-m);padding:4px 0 4px 12px;margin-top:14px}
.opinion p:last-child{font-size:15px;line-height:1.6;margin-top:4px;font-weight:500}
.sec{font-size:17px;font-weight:700;color:var(--ink);margin:26px 0 10px}
.news{font-size:14px;color:#4B5146;padding:6px 0}
.record{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:700;margin-top:8px}
/* 결재 */
.approve{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.approve table{border-collapse:collapse;font-size:11px;text-align:center}
.approve td{border:1px solid #BFC5B8;width:46px;padding:2px 0;color:var(--sub)}
.approve tr:last-child td{height:38px;font-family:var(--serif);font-weight:700;color:var(--red);font-size:12px}
.opt{display:block;width:100%;text-align:left;border:2px solid transparent;background:#fff;border-radius:18px;padding:16px;margin-top:10px}
.opt:hover{border-color:var(--olive-m)}
.opt.on{border-color:var(--olive)}
.outc{display:flex;align-items:flex-start;gap:8px;margin-top:10px}
.outc .ol{font-size:12px;font-weight:600;color:var(--sub);min-width:52px;padding-top:3px}
.outc .ol.bad{color:var(--sub)}
.opt .top2{display:flex;align-items:center;gap:8px}
.opt .top2 b{flex:1;font-size:15px}
.opt .pct{font-size:20px;font-weight:700;color:var(--olive)}
.opt .pct.low{color:var(--olive)}
.xcard .luck{font-size:13px;color:var(--sub);text-align:center;margin:12px 0 2px}
.xcard .luck b{color:var(--olive)}
/* 후보 선택 */
.cand{display:block;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:22px;padding:16px 18px;margin-top:10px;font:inherit;color:inherit;cursor:pointer}
.cand.on{border-color:var(--olive)}
.cand .r{display:flex;align-items:center;gap:8px}
.cand .r b{flex:1;font-size:17px}
.cand .pot{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--wash);color:var(--faint)}
.cand .pot.op{background:var(--olive-t);color:var(--olive)}
.cand .pot.hot{background:#FBF1E2;color:#9A5B12}
.cand .nick{font-size:15px;font-weight:600;color:var(--olive);margin-top:8px}
.cand .str{font-size:13px;color:var(--sub);margin-top:4px}
.cbars{margin-top:12px;display:grid;grid-template-columns:62px 1fr 26px;gap:7px 10px;align-items:center;font-size:13px;color:var(--sub)}
.cbars i{display:block;height:6px;border-radius:3px;background:var(--wash);overflow:hidden}
.cbars i u{display:block;height:100%;background:var(--olive);border-radius:3px}
.cbars em{font-style:normal;font-weight:700;color:var(--ink);text-align:right}
.cbars .hi{color:var(--ink);font-weight:700}
.cand .trait{margin-top:12px;font-size:12px;color:var(--olive);background:var(--olive-t);border-radius:10px;padding:8px 10px;line-height:1.5}
.ctools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ctools.one{grid-template-columns:1fr}
.ctool{background:#fff;border:0;border-radius:16px;padding:12px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer}
.ctool b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px}
.ctool span{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.ctool span.free{color:var(--olive);font-weight:600}
.ctool:disabled{opacity:.5;cursor:default}
/* 사이트 */
.lobbyhd .iconbtn{position:relative;color:var(--sub)}
.lobbyhd .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:#E5483D}
a.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.newnote{display:flex;align-items:center;gap:12px;margin:10px 12px 0;background:#fff;border-radius:18px;padding:14px 16px;color:inherit;text-decoration:none}
.newnote .nb{font-size:11px;font-weight:800;color:#fff;background:var(--olive);border-radius:6px;padding:3px 6px}
.newnote>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.newnote b{font-size:14px}.newnote span span{font-size:13px;color:var(--sub)}
.newnote svg{color:var(--faint)}
.sitefoot{margin:26px 0 0;background:#fff;border-radius:24px;padding:20px 20px 16px;color:var(--sub);font-size:13px;line-height:1.6}
.sitefoot .ftop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sitefoot .fn{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.sitefoot .ft{font-size:13px;color:var(--sub);margin-top:2px}
.sitefoot .fver{font-size:12px;font-weight:700;color:var(--olive);background:var(--olive-t);border-radius:999px;padding:5px 10px;text-decoration:none;white-space:nowrap}
.sitefoot .fcols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 0}
.sitefoot .fcols div{display:flex;flex-direction:column;gap:9px}
.sitefoot .fh{font-size:12px;font-weight:700;color:var(--faint);margin-bottom:1px}
.sitefoot .fcols a{color:#4E5968;text-decoration:none;font-size:14px;font-weight:500}
.sitefoot .fbot{display:flex;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.sitefoot .fbot b{color:var(--ink);font-weight:700}
.sitefoot .cp{font-size:12px;color:var(--faint);margin-top:6px}
.prose{font-size:14px;color:#4E5968;line-height:1.7;padding-top:14px}
.prose p+p{margin-top:8px}
.prose ul,.prose ol{padding-left:18px}.prose li+li{margin-top:6px}
.prose b{color:var(--ink)}
.prose a{color:var(--olive);font-weight:600}
.setrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.setrow+.setrow,.kv+.setrow{border-top:1px solid var(--line)}
.setrow>span{flex:1;display:flex;flex-direction:column}
.setrow b{font-size:15px}.setrow span span{font-size:13px;color:var(--sub);margin-top:2px}
.tog{width:44px;height:26px;border-radius:13px;background:#D5D9CF;position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--olive)}.tog.on::after{transform:translateX(18px)}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
.adslot{background:#fff;border-radius:22px;padding:10px 12px 12px;margin-top:10px;text-align:center}
.adslot .adlabel{display:block;text-align:left;font-size:11px;color:var(--faint);font-weight:600;margin-bottom:6px}
.adslot .adin{margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal .galad{grid-column:1/-1}
.tierb{font-size:11px;font-weight:700;color:var(--sub);background:var(--wash);border-radius:6px;padding:3px 6px;margin-left:auto;white-space:nowrap}
.tierb.hot{color:#9A5B12;background:#FBF1E2}
.tierb + .pct{margin-left:8px}
.pity{margin-top:10px;font-size:13px;color:var(--olive);background:var(--olive-t);border-radius:12px;padding:10px 12px;line-height:1.5}
.resnote{margin-top:14px;font-size:13px;color:var(--sub);line-height:1.6;background:var(--wash);border-radius:12px;padding:12px 14px}
.resnote.hot{color:#9A5B12;background:#FBF1E2;font-weight:600}
.opt .d{font-size:13px;color:var(--sub);margin-top:4px}
.opt .why{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5;padding-top:10px;border-top:1px solid var(--line)}
.effects{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* 1년 게이지 */
.gauge{height:10px;background:var(--wash);border-radius:5px;overflow:hidden;margin:28px 0 10px}
.gauge div{height:100%;width:0;background:var(--olive);border-radius:5px}
.gauge.paused div{background:var(--amber)}
/* 달력 (안 씀) */
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:26px 0 18px}
.cal div{height:46px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--faint);transition:background .2s,color .2s}
.cal div.on{background:var(--olive);border-color:var(--olive);color:#fff}
.cal div.now{border:1.5px solid var(--olive);color:var(--olive)}
